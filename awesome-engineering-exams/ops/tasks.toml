# Hive backlog.
# Single writer: the JEVX lane. Worker lanes (hermes, opencode) never edit this file.
# The "human" lane is the owner's checklist: agents never pick those tasks.
#
# priority: 1 = most urgent.  deps: ids that must be done first.  blocked = true parks a task.
# DONE    = ops/done/<id>.md exists on main (a receipt that landed through a merged PR).
# CLAIMED = refs/heads/claim/<id> or a branch agent/<lane>/<id> exists on the remote.

# ---------------------------------------------------------------- human (owner, one-time)

[[task]]
id = "H-001"
lane = "human"
priority = 1
title = "Log in once on the Mac: gh auth login (repo scope)"
accept = ["gh auth status shows the lakhidas168-ship-it account"]

[[task]]
id = "H-002"
lane = "human"
priority = 1
title = "Install the hourly schedule from ops/crontab.example and set HIVE_CMD_HERMES / HIVE_CMD_JEVX"
accept = ["crontab -l shows the three hive lines", "~/.hive/*.log gets a new entry every hour"]

[[task]]
id = "H-003"
lane = "human"
priority = 2
title = "Optional: protect main so only green PRs merge (Settings → Branches → require 'validate' and 'hive-gate')"
accept = ["a PR with a failing content gate cannot be merged"]

# ---------------------------------------------------------------- hermes (research + content)

[[task]]
id = "T-001"
lane = "hermes"
priority = 1
title = "Verify the GATE EE page against the official GATE 2027 information brochure"
accept = [
  "every number under 'Exam pattern' and 'At a glance' matches the brochure; brochure URL listed under Official sources",
  "syllabus section matches the official EE syllabus PDF (paraphrase allowed, topics must match)",
  "frontmatter verification = official and last_verified = the run date, only if the official documents were opened this run",
]

[[task]]
id = "T-002"
lane = "hermes"
priority = 1
title = "Verify the UPSC ESE EE page against the ESE 2027 notification on upsc.gov.in"
accept = [
  "pattern, age limit and stage marks match the notification; notification URL listed under Official sources",
  "frontmatter verification = official only if the notification PDF was opened this run",
]

[[task]]
id = "T-003"
lane = "hermes"
priority = 2
title = "Verify the SSC JE EE page against the latest SSC JE notice on ssc.gov.in"
accept = ["Paper I/II pattern and negative marking match the notice; notice URL listed", "verification updated honestly"]

[[task]]
id = "T-004"
lane = "hermes"
priority = 2
title = "Verify the RRB JE page against the latest CEN (Junior Engineer) on rrbapply.gov.in or a regional RRB site"
accept = ["CBT-1/CBT-2 sections, time and negative marking match the CEN; CEN URL listed", "verification updated honestly"]

[[task]]
id = "T-005"
lane = "hermes"
priority = 2
title = "Verify the UPSC CSE page (pattern + Electrical Engineering optional syllabus) against the CSE notification"
accept = ["marks per paper and the EE optional topic list match the notification; URL listed", "verification updated honestly"]

[[task]]
id = "T-006"
lane = "hermes"
priority = 2
title = "State AE/JE tracker: confirm every commission/utility domain and add the latest EE AE/JE advertisement per state (Assam first)"
accept = [
  "every link in the tracker opens on an official domain; dead ones removed",
  "Assam row lists the latest APSC / APDCL / AEGCL / APGCL EE advertisement with date and URL, or states none open",
]

[[task]]
id = "T-007"
lane = "hermes"
priority = 3
title = "PSU tracker: record each PSU's most recent EE recruitment channel (GATE year / own exam) with the official advertisement link"
accept = ["each row has channel + advertisement URL + date, or 'no EE recruitment found since <year>'"]

[[task]]
id = "T-008"
lane = "hermes"
priority = 3
deps = ["T-001"]
title = "GATE EE subject-wise marks for the last 5 official papers → resources/gate-ee-weightage.md"
accept = [
  "table of marks per subject per year, counted from the official question papers (URLs listed per year)",
  "method section says how each question was mapped to a subject; totals per year add up to 100",
]

[[task]]
id = "T-009"
lane = "hermes"
priority = 3
deps = ["T-002"]
title = "ESE EE Prelims topic map from official papers (Paper I + Paper II, last 5 years) → resources/ese-ee-topic-map.md"
accept = ["question counts per topic per year from upsc.gov.in papers, URLs listed; counts per paper add up"]

[[task]]
id = "T-010"
lane = "hermes"
priority = 4
title = "Publish the EE concept prerequisite map from the Sovereign Learning OS graph → resources/prerequisite-map.md"
accept = [
  "Mermaid graph of EE concepts and prerequisite edges, exported from the local graph",
  "no transcript text or third-party lecture content included, only concept names and edges",
]

[[task]]
id = "T-011"
lane = "hermes"
priority = 4
title = "Add the other circuital branches: exams/gate-ec.md and exams/gate-in.md"
accept = ["both pages pass the content gate with every required section", "verification status honest"]

# ---------------------------------------------------------------- opencode (tooling)

[[task]]
id = "T-101"
lane = "opencode"
priority = 2
title = "Original practice questions: questions/ JSON format + validator rule + 3 sample EE questions"
accept = [
  "schema fields: id, exams, subject, question, options, answer, solution, author, license, source='original'",
  "scripts/validate.py rejects a question without an answer, solution or author (unit test proves it)",
]

[[task]]
id = "T-102"
lane = "opencode"
priority = 3
title = "Staleness report: validate.py --suggest-tasks prints ready-to-paste tasks.toml entries for stale or non-official pages"
accept = ["unit test covers a stale page and a secondary page", "output parses as TOML"]

[[task]]
id = "T-103"
lane = "opencode"
priority = 3
title = "Formula sheets: formula-sheets/<subject>.md format + validator check that $$ math blocks are balanced"
accept = ["one sample sheet (Electric Circuits) passes", "unit test proves an unbalanced block fails"]

[[task]]
id = "T-104"
lane = "opencode"
priority = 4
title = "GitHub Pages site for the list (mkdocs-material, built in CI from the same markdown, no copies)"
accept = ["workflow builds the site on push to main", "README explains the one Settings click the owner must make to enable Pages"]
