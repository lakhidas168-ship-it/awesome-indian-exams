<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CBT Mock Engine</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 250px; border-right: 1px solid #ccc; padding: 10px; overflow-y: auto; }
        #main { flex: 1; padding: 20px; }
        .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .q-btn { padding: 10px; border: 1px solid #ccc; cursor: pointer; text-align: center; }
        .q-btn.answered { background: green; color: white; }
        .q-btn.marked { background: orange; }
        .q-btn.current { border: 2px solid blue; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Questions</h3>
        <div id="palette" class="palette"></div>
    </div>
    <div id="main">
        <div id="timer">Time: <span id="time">60:00</span></div>
        <div id="question-area">
            <h2 id="q-text">Loading...</h2>
            <div id="options"></div>
            <button onclick="markForReview()">Mark for Review</button>
            <button onclick="nextQuestion()">Next</button>
            <button onclick="submitTest()">Submit</button>
        </div>
    </div>
    <script>
        let questions = [];
        let currentIdx = 0;
        let answers = JSON.parse(localStorage.getItem('answers') || '{}');
        let marked = JSON.parse(localStorage.getItem('marked') || '{}');
        let timeLeft = 3600;

        async function loadQuestions() {
            // In a real scenario, this would fetch a list of questions
            // For now, we simulate with a few
            questions = [
                { id: "ee-eval-01", question: "A 3 ohm and a 7 ohm resistor are connected in series across an ideal 30 V DC source. What is the voltage across the 7 ohm resistor?", options: ["10 V", "14 V", "21 V", "30 V"], answer: "21 V" },
                { id: "ee-eval-02", question: "What is the unit of resistance?", options: ["Volt", "Ampere", "Ohm", "Watt"], answer: "Ohm" }
            ];
            renderPalette();
            showQuestion();
        }

        function renderPalette() {
            const p = document.getElementById('palette');
            p.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('div');
                btn.className = `q-btn ${answers[q.id] ? 'answered' : ''} ${marked[q.id] ? 'marked' : ''} ${i === currentIdx ? 'current' : ''}`;
                btn.innerText = i + 1;
                btn.onclick = () => { currentIdx = i; showQuestion(); renderPalette(); };
                p.appendChild(btn);
            });
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('q-text').innerText = q.question;
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.options.forEach(opt => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="radio" name="q" value="${opt}" ${answers[q.id] === opt ? 'checked' : ''} onchange="saveAnswer('${opt}')"> ${opt}<br>`;
                optDiv.appendChild(label);
            });
        }

        function saveAnswer(opt) {
            answers[questions[currentIdx].id] = opt;
            localStorage.setItem('answers', JSON.stringify(answers));
            renderPalette();
        }

        function markForReview() {
            marked[questions[currentIdx].id] = true;
            localStorage.setItem('marked', JSON.stringify(marked));
            renderPalette();
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                showQuestion();
                renderPalette();
            }
        }

        function submitTest() {
            let score = 0;
            questions.forEach(q => {
                if (answers[q.id] === q.answer) score += 1;
                else if (answers[q.id]) score -= 0.25; // Negative marking
            });
            alert("Test Submitted! Score: " + score);
        }

        setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = Math.floor(timeLeft/60) + ":" + (timeLeft%60).toString().padStart(2, '0');
        }, 1000);

        loadQuestions();
    </script>
</body>
</html>
