# Hive-wide settings. Changes here change how the whole hive spends its time: owner or an approved OpenCode task only.

[focus]
# Share of runs per focus, as integer weights. core = the engineering track (the owner's own exams);
# india = every other exam family in the registry. 4 : 1 means 80% / 20% of each lane's runs.
# If the chosen focus has no ready task, the lane takes a task from the other focus instead of idling.
core = 4
india = 1

[lane_offset]
# Shifts each lane's rotation so the lanes don't all switch to "india" in the same hour.
hermes = 0
opencode = 2
jevx = 0

[free_agent]
# Zero-cost agent used when a lane's command is "free-agent" (ops/free_agent.py).
# Providers are tried in order; one without a key, or rate-limited, is skipped.
providers = ["github", "gemini", "openrouter", "groq", "ollama"]
max_steps = 14
# Free tiers cap tokens per request (GitHub Models: about 8k in / 4k out), so the agent keeps its context under this.
context_chars = 22000

[free_agent.models]
github = ["openai/gpt-4.1-mini", "openai/gpt-4o-mini"]
gemini = ["gemini-2.5-flash"]
openrouter = ["deepseek/deepseek-chat-v3-0324:free", "meta-llama/llama-3.3-70b-instruct:free"]
groq = ["llama-3.3-70b-versatile"]
ollama = ["qwen2.5:7b-instruct"]
