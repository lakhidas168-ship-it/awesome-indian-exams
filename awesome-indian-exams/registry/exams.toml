# Registry of India's most-attempted competitive exams.
#
# One entry per exam. `modules` maps an exam to the shared syllabus blocks it tests, so one preparation
# counts for many exams (see resources/overlap-map.md, generated from this file). The mapping is indicative:
# each exam's official syllabus decides depth.
#
# official_site is left blank when the official domain has not been confirmed yet; the hive fills it.
# An exam's page lives at exams/<family>/<id>.md. The README index, resources/all-exams.md and
# resources/overlap-map.md are generated from this file by scripts/validate.py --write.
#
# focus: "core" families get ~80% of hive runs, "india" families ~20% (ops/hive.toml).

