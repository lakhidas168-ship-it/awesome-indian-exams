name: pages

# The list as a free website with search, dark mode and a phone-friendly layout, built from the same markdown
# (mkdocs.yml at the repository root), plus the open-data export at /data/exams.json.
# Runs only when main changes (the Mac hive publishes at most once an hour); no schedule.
# One-time owner click: Settings → Pages → Source: "GitHub Actions". Until then the site is built and checked on
# every run but not deployed.
on:
  push:
    branches: [main]
    paths: ["awesome-indian-exams/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["awesome-indian-exams/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # MkDocs 2.0 drops the plugin and theme system Material relies on, so both stay pinned to the 1.x line.
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.*"
      - run: mkdocs build
      - run: python3 awesome-indian-exams/scripts/export_json.py --out site/data/exams.json
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The website is built but not deployed: set Settings → Pages → Source to \"GitHub Actions\""
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.deploy == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
