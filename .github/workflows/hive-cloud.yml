name: hive-cloud

# Free 24/7 cloud hive: runs every 3 hours at :41 when the Mac is away (>2 h).
# ONE job, 6 workers (3 hermes-lane + 3 opencode-lane) in parallel against a LOCAL bare repo
# so claims/agent branches NEVER reach GitHub. After ~40 min, judge publishes approved work
# and pushes at most ONE commit to origin/main.
# Providers: GitHub Models via GITHUB_TOKEN (free) + optional secrets OPENCODE_API_KEY / GEMINI_API_KEY / OPENROUTER_API_KEY.

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: hive-cloud
  cancel-in-progress: false

jobs:
  cloud-batch:
    if: vars.HIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HIVE_MAC_LAST_SEEN: ${{ vars.HIVE_MAC_LAST_SEEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional PDF text extraction for official notifications
        run: pip install --quiet pypdf || true
      - name: Run cloud batch (6 workers, judge, at most one push)
        run: |
          git config --global user.name "hive-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash awesome-indian-exams/ops/cloud_batch.sh
