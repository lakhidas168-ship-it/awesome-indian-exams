name: hive-cloud

# The free 24/7 hive: every 20 minutes, 6 Hermes (content) and 6 OpenCode (tooling) workers each take one task
# in parallel, and the JEVX judge publishes what passes every gate. Rate-limited workers just requeue their task.
# Cost: public-repo Actions minutes are free; GitHub Models is free (rate-limited) with the workflow token.
# Kill switch: set the repository variable HIVE_ENABLED to "false" (Settings → Secrets and variables → Actions).
# Optional capacity: repository secrets OPENCODE_API_KEY (owner's OpenCode Go plan: DeepSeek V4.1 Flash for the
# OpenCode lane and the judge), GEMINI_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY (free tiers).

# 2026-09-27 (owner's Mac): the schedule is OFF. The hive runs on the owner's Mac against a LOCAL bare repo and
# publishes one gated, batched commit per hour here, because claims/branches pushed every 20 minutes look like
# git-as-a-message-bus, which got the owner's previous GitHub account flagged as spam. Run by hand if needed.
on:
  workflow_dispatch:

permissions:
  contents: write   # claim tasks, push agent branches, publish approved work to main
  models: read      # GitHub Models inference with GITHUB_TOKEN (free tier)

concurrency:
  group: hive-cloud
  cancel-in-progress: false

jobs:
  work:
    if: vars.HIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:   # 6 Hermes + 6 OpenCode workers in parallel; atomic claims keep them on different tasks
        lane: [hermes, opencode]
        n: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Optional PDF text extraction for official notifications
        run: pip install --quiet pypdf || true
      - name: One hive task (${{ matrix.lane }}-${{ matrix.n }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HIVE_CMD_HERMES: free-agent
          HIVE_CMD_OPENCODE: free-agent
          HIVE_FALLBACK: free-agent
          HIVE_WHERE: cloud
          HIVE_SANDBOX: "1"
          HIVE_OPEN_PR: "0"
          HIVE_HOME: ${{ runner.temp }}/hive
          HIVE_TIMEOUT: "1800"
        run: |
          git config --global user.name "hive-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # With the owner's OpenCode Go key, the OpenCode lane runs the real OpenCode CLI on DeepSeek V4.1 Flash;
          # if that fails without changes, the runner retries once on the free agent.
          if [ "${{ matrix.lane }}" = "opencode" ] && [ -n "$OPENCODE_API_KEY" ]; then
            npm install -g --silent opencode-ai && export HIVE_CMD_OPENCODE="opencode run -m opencode-go/deepseek-v4.1-flash"
          fi
          awesome-indian-exams/ops/run-hourly.sh "${{ matrix.lane }}" "${{ matrix.lane }}-${{ matrix.n }}"

  judge:
    needs: work
    if: always() && vars.HIVE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Judge agent branches and publish approved work (JEVX)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HIVE_WHERE: cloud
        run: |
          git config --global user.name "hive-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 awesome-indian-exams/ops/agentctl.py reap --hours 6 || true
          python3 awesome-indian-exams/ops/judge.py --publish --limit 12
          python3 awesome-indian-exams/ops/doctor.py || true   # health report in the log
